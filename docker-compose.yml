services:
  php:
    build:
      context: ./docker/php
    container_name: book_library_php
    volumes:
      - ./apps/amac-book-library:/var/www/html
    networks:
      - book_library_net

  nginx:
    image: nginx:alpine
    container_name: book_library_nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/amac-book-library:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - book_library_net

networks:
  book_library_net:
    driver: bridge